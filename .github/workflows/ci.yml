name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test @khoralabs/agent-capabilities
        run: bun run --filter '@khoralabs/agent-capabilities' test

      - name: Test @khoralabs/agent-capabilities-ai-sdk
        run: bun run --filter '@khoralabs/agent-capabilities-ai-sdk' test

      - name: Build publishable packages
        run: bun run build

  smithy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Smithy CLI
        run: |
          SMITHY_VERSION=1.49.0
          curl -fsSL "https://github.com/smithy-lang/smithy/releases/download/${SMITHY_VERSION}/smithy-cli-${SMITHY_VERSION}.zip" -o smithy-cli.zip
          unzip -q smithy-cli.zip -d "$HOME/smithy-cli"
          echo "$HOME/smithy-cli/bin" >> "$GITHUB_PATH"

      - name: Validate Smithy models
        working-directory: packages/capabilities-spec
        run: smithy validate model
