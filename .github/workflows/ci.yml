name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run format:check

      - name: Build publishable packages
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test @khoralabs/agent-capabilities
        run: bun run --filter '@khoralabs/agent-capabilities' test

      - name: Test @khoralabs/agent-capabilities-ai-sdk
        run: bun run --filter '@khoralabs/agent-capabilities-ai-sdk' test

  smithy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Smithy CLI
        uses: smithy-lang/setup-smithy-cli@v1
        with:
          version: "1.70.0"
          config: packages/capabilities-spec/smithy-build.json

      - name: Validate Smithy models
        working-directory: packages/capabilities-spec
        run: smithy validate model
