name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # Catch emitDeclarationOnly / packaging failures that typecheck alone can miss
      - run: bun run build

  smithy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Smithy CLI
        run: |
          SMITHY_VERSION=1.70.0
          SMITHY_BIN="$HOME/smithy-cli/smithy-cli-linux-x86_64/bin"
          curl -fsSL \
            "https://github.com/smithy-lang/smithy/releases/download/${SMITHY_VERSION}/smithy-cli-linux-x86_64.zip" \
            -o /tmp/smithy-cli.zip
          mkdir -p "$HOME/smithy-cli"
          unzip -qo /tmp/smithy-cli.zip -d "$HOME/smithy-cli"
          echo "$SMITHY_BIN" >> "$GITHUB_PATH"
          echo "SMITHY_BIN=$SMITHY_BIN" >> "$GITHUB_ENV"
          "$SMITHY_BIN/smithy" --version

      - name: Validate Smithy models
        working-directory: packages/capabilities-spec
        run: $SMITHY_BIN/smithy validate model
