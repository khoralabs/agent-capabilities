name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run format:check

      - name: Build publishable packages
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test @khoralabs/agent-capabilities
        run: bun run --filter '@khoralabs/agent-capabilities' test

      - name: Test @khoralabs/agent-capabilities-ai-sdk
        run: bun run --filter '@khoralabs/agent-capabilities-ai-sdk' test

  smithy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Smithy CLI
        run: |
          SMITHY_VERSION=1.70.0
          SMITHY_BIN="$HOME/smithy-cli/smithy-cli-linux-x86_64/bin"
          curl -fsSL \
            "https://github.com/smithy-lang/smithy/releases/download/${SMITHY_VERSION}/smithy-cli-linux-x86_64.zip" \
            -o /tmp/smithy-cli.zip
          mkdir -p "$HOME/smithy-cli"
          unzip -qo /tmp/smithy-cli.zip -d "$HOME/smithy-cli"
          echo "$SMITHY_BIN" >> "$GITHUB_PATH"
          echo "SMITHY_BIN=$SMITHY_BIN" >> "$GITHUB_ENV"
          "$SMITHY_BIN/smithy" --version

      - name: Validate Smithy models
        working-directory: packages/capabilities-spec
        run: $SMITHY_BIN/smithy validate model
